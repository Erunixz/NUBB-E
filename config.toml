# NUBB-E settings. Change things here, not in the Python files.
# Paths are relative to this folder (or use a full path).
# If a setting is missing, NUBB-E uses its built-in default.

[brain]
llama_server = "bin/llama.cpp/llama-server.exe"
model = "models/Qwen3.6-35B-A3B-MTP-UD-IQ4_XS.gguf"
mmproj = "models/mmproj-Qwen3.6-35B-A3B-F16.gguf"   # vision. Set to "" to turn it off

# Tuned in Phase 1 on the RTX 4060 (8 GB) + Ryzen 7 7745HX:
# about 20 to 23 tok/s with vision loaded and 0.6 GB VRAM to spare.
# Lower n_cpu_moe = more on the GPU. 30 or lower overflows VRAM with vision on.
n_cpu_moe = 31
threads = 16
context = 32768
# --no-cache-idle-slots keeps the chat's cache in place while memory learning runs,
# so each new message only reads the new part instead of the whole chat again.
# --parallel 4: one brain slot each for chat, memory learning, Look and voice.
extra_flags = ["-ngl", "99", "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0", "--jinja",
               "--no-cache-idle-slots", "--parallel", "4"]
port = 8080

# Max "thinking" tokens in Smart mode before it must answer (-1 = no limit).
# At about 21 tok/s, 600 tokens is up to about 30 s of thinking.
reasoning_budget = 600

# Stop the brain after this many minutes with no chat, to free RAM and VRAM
# and let the laptop cool down. It wakes up again on your next message.
idle_unload_minutes = 10

# Fast backup model (about 33 tok/s, fits fully on the GPU, no vision).
# To use it, swap in these lines:
#   model = "models/Qwen3.5-9B-Q4_K_M.gguf"
#   mmproj = ""
#   n_cpu_moe = 0
#   extra_flags = ["-ngl", "99", "-ub", "256", "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0", "--jinja"]

[app]
port = 8765
history_turns = 40   # recent messages sent to the model

# Quick bar: a small see-through bar on top of any app (Windows).
quick_bar = true
quick_hotkey = "alt+space"     # e.g. "ctrl+shift+space", "alt+n", "ctrl+alt+f1"
close_to_background = true     # closing the app window keeps NUBB-E running for the quick bar

[voice]
whisper_model = "base.en"    # tiny.en / base.en / small.en (base.en: 0.6 s per question on this CPU, small.en: 1.9 s)
kokoro_voice = "am_michael"          # picked by Erfan in Phase 5
kokoro_speed = 1.05
piper_voice = "voices/en_US-amy-medium.onnx"   # backup voice if Kokoro cannot load
mic_threshold = 0.015        # mic loudness that counts as talking (tuned in Phase 5)
